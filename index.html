<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Convert images to braille art - turn any image into readable braille text">
	<title>Image to Braille</title>
	<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⠿</text></svg>">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div id="loading">Processing...</div>
	<div id="error-message" role="alert" aria-live="polite"></div>
	<div id="preview-container">
		<img id="preview" alt="Original image preview" aria-label="Original image preview">
	</div>
	<textarea id="text" readonly aria-label="Braille output"></textarea>
	<nav id="options">
		<div><a href="https://github.com/tahmid-chowdhury/Image-to-Braille" target="_blank" rel="noopener">Open Repo</a></div>
		<div>
			<label for="file">Load Image:</label>
			<input id="file" type="file" accept="image/*" aria-label="Choose image file">
		</div>

		<div>
			<input type="checkbox" id="preview-toggle" aria-label="Show image preview">
			<label for="preview-toggle">Show Preview</label>
		</div>

		<div>
			<input type="checkbox" id="darktheme" aria-label="Toggle dark theme">
			<label for="darktheme">Dark Theme</label>
		</div>
		<div>
			<input type="checkbox" id="inverted" aria-label="Invert colors">
			<label for="inverted">Invert</label>
		</div>
		<div>
			<input type="checkbox" id="dithering" aria-label="Enable dithering">
			<label for="dithering">Dithering</label>
		</div>
		<div>
			<input type="checkbox" id="monospace" aria-label="Disable placeholder spacing">
			<label for="monospace">Monospace</label>
		</div>
		<div>
			<label for="threshold">Threshold:</label>
			<input type="range" id="threshold" min="0" max="255" value="128" aria-label="Brightness threshold">
			<span id="threshold-value">128</span>
		</div>
		<div>
			<label for="greyscale_mode">Greyscale:</label>
			<select id="greyscale_mode">
				<option value="luminance">Luminance</option>
				<option value="lightness">Lightness</option>
				<option value="average">Average</option>
				<option value="value">Value</option>
			</select>
		</div>
		<div>
			<label for="width">Width (chars):</label>
			<input type="number" min="2" value="50" step="2" max="500" id="width" aria-label="Output width in characters">
		</div>
		<div>
			<button id="clipboard" type="button" aria-label="Copy output to clipboard">Copy to clipboard</button>
			<span class="hint">Ctrl+C</span>
		</div>
		<div>
			<button id="export" type="button" aria-label="Save as text file">Save as .txt</button>
		</div>
		<div>
			<button id="reset" type="button" aria-label="Reset all settings to defaults">Reset</button>
		</div>
		<div>
			<span id="charcount">0</span>
		</div>
	</nav>
	<script type="module" src="main.js"></script>
</body>
</html>
